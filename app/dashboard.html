    <script>
        window.addEventListener('beforeunload', function() {
            // console.log('ssss')
            document.getElementById('pageLoader').style.display = 'block';
            document.querySelector('.body-bg').style.display = 'none'; 
        });

        window.addEventListener('load', function() {
            // console.log('dddddd')
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none'; 
                document.querySelector('.body-bg').style.display = 'block'; 
            }, 500); 
        });
    </script>



    <script>
        function toggleDropdown() {
            var dropdown = document.getElementById("dropdownMenu");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        window.onclick = function (event) {
            var dropdown = document.getElementById("dropdownMenu");
            if (!event.target.matches('.nftmax-card-hover') && !event.target.matches('.nftmax-card-hover *')) {
                dropdown.style.display = "none";
            }
        };

        async function loadHTML(containerId, filePath) {
        try {
            const res = await fetch(filePath);
            const data = await res.text();

            const container = document.getElementById(containerId);
            container.innerHTML = data;

            const temp = document.createElement("div");
            temp.innerHTML = data;

            const scripts = temp.querySelectorAll("script");
            scripts.forEach(oldScript => {
            const newScript = document.createElement("script");
            if (oldScript.src) {
                newScript.src = oldScript.src;
            } else {
                newScript.textContent = oldScript.textContent;
            }
            document.body.appendChild(newScript);
            });

            console.log(`${filePath} loaded successfully`);
        } catch (err) {
            console.error(`❌ Error loading ${filePath}:`, err);
        }
        }

        // 🧱 Load both components
        loadHTML("sidebar-container", "sidebar.html");
        loadHTML("navbar-container", "navbar.html");
    </script>
